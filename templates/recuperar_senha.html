<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNode - Recuperar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-custom {
            background: #1e293b;
            border: none;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            max-width: 400px;
            width: 100%;
        }
        .btn-primary-custom {
            background: #38bdf8;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            padding: 12px;
        }
        .btn-primary-custom:hover {
            background: #0ea5e9;
        }
        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="card card-custom">
    <h3 class="text-center mb-3" style="color: #38bdf8; font-weight: bold;">🔒 Recuperar Senha</h3>
    <p class="text-muted text-center small mb-4">Insira o e-mail cadastrado na sua conta para receber as instruções de recuperação.</p>
    
    <form action="/recuperar_senha" method="POST">
        <div class="mb-3">
            <label for="email" class="form-label" style="color: #cbd5e1;">E-mail do usuário</label>
            <input type="email" name="email" id="email" class="form-control" style="background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px;" required placeholder="seuemail@exemplo.com">
        </div>
        
        <button type="submit" class="btn btn-primary-custom w-100 mb-3">Enviar Link de Recuperação</button>
        
        <div class="text-center">
            <a href="/login" class="back-link">⬅ Voltar para o Login</a>
        </div>
    </form>
</div>

</body>
</html>
