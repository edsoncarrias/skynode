<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Trocar Senha</title>

    <style>

        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:#1e293b;
            padding:30px;
            border-radius:10px;
            width:350px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .msg{
            color:#f87171;
            margin-top:10px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>Trocar Senha</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="msg">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <input
                type="password"
                name="current_password"
                placeholder="Senha atual"
                required
            >

            <input
                type="password"
                name="new_password"
                placeholder="Nova senha"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirmar nova senha"
                required
            >

            <button type="submit">
                Alterar Senha
            </button>

        </form>

    </div>

</body>

</html>
