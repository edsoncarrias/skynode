<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>SkyNode Remote</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<style>

body{
    background:#0f172a;
    margin:0;
    color:white;
    font-family:Arial;
}

.toolbar{

    position:fixed;

    top:0;

    width:100%;

    background:#111827;

    padding:15px;

    display:flex;

    gap:10px;

    z-index:999;
}

.remote-container{

    margin-top:90px;

    text-align:center;
}

#screen{

    width:95%;

    border-radius:10px;

    border:2px solid #1e293b;
}

</style>

</head>

<body>

<!-- TOOLBAR -->

<div class="toolbar">

    <button
        class="btn btn-warning"
        onclick="sendCmd('shutdown -s -t 0')"
    >
        ⛔ Desligar
    </button>

    <button
        class="btn btn-primary"
        onclick="sendCmd('shutdown -r -t 0')"
    >
        🔄 Reiniciar
    </button>

    <button
        class="btn btn-success"
        onclick="sendCmd('notepad')"
    >
        📝 Notepad
    </button>

    <button
        class="btn btn-danger"
        onclick="window.location.href='/dashboard'"
    >
        ❌ Sair
    </button>

</div>

<!-- SCREEN -->

<div class="remote-container">

    <img
        id="screen"
        src="/screenshots/{{ hostname }}.jpg"
    >

</div>

<script>

// =====================================
// REFERENCIA IMG
// =====================================

const screen =
    document.getElementById("screen")

// =====================================
// AUTO REFRESH SCREEN
// =====================================

setInterval(() => {

    screen.src =
        "/screenshots/{{ hostname }}.png?t="
        + new Date().getTime()

}, 400)

// =====================================
// CLICK ESQUERDO
// =====================================

screen.addEventListener("click", () => {

    fetch(
        `/send_command/{{ hostname }}/mouse_click`
    )

})

// =====================================
// CLICK DIREITO
// =====================================

screen.addEventListener("contextmenu", (e) => {

    e.preventDefault()

    fetch(
        `/send_command/{{ hostname }}/right_click`
    )

})

// =====================================
// TECLADO
// =====================================

document.addEventListener("keydown", (e) => {

    fetch(

        `/send_command/{{ hostname }}/keyboard|${e.key}`

    )

})

// =====================================
// FUNÇÃO BOTÕES
// =====================================

async function sendCmd(command){

    try{

        const response = await fetch(

            "/api/terminal/{{ hostname }}",

            {

                method: "POST",

                headers: {

                    "Content-Type":
                    "application/json"

                },

                body: JSON.stringify({

                    command: command

                })

            }

        )

        const data =
            await response.json()

        console.log(data)

    }

    catch(err){

        console.log(err)

    }

}

</script>

</body>
</html>
