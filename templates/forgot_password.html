,<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNode - Recuperar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container-forgot { 
            background: #111827; 
            padding: 40px; 
            border-radius: 15px; 
            width: 100%; 
            max-width: 450px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); 
            border: 1px solid #1e293b;
        }
        h2 { margin-bottom: 10px; text-align: center; color: #38bdf8; font-weight: bold; }
        p.subtitle { text-align: center; font-size: 14px; color: #94a3b8; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
        input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: #fff; 
            font-size: 16px; 
        }
        input:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { background: #0369a1; }
        .links { margin-top: 20px; text-align: center; }
        .links a { color: #38bdf8; text-decoration: none; font-size: 14px; }
        .links a:hover { text-decoration: underline; }

        /* RESPONSIVIDADE */
        @media (max-width: 480px) {
            .container-forgot { padding: 25px 20px; }
            h2 { font-size: 24px; }
            input, button { padding: 14px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="container-forgot">
        <h2>Recuperar Senha</h2>
        <p class="subtitle">Insira seu usuário cadastrado para receber uma nova senha temporária por e-mail.</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-info text-center py-2 style="font-size: 14px;">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Nome de Usuário (Username)</label>
                <input type="text" name="username" placeholder="Ex: admin" required>
            </div>
            <button type="submit">Enviar Nova Senha</button>
        </form>

        <div class="links">
            <a href="/login">← Voltar para o Login</a>
        </div>
    </div>

</body>
</html>
