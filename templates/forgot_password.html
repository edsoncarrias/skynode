<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNode - Recuperar Senha</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; padding: 40px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        h2 { margin-bottom: 10px; text-align: center; color: #38bdf8; }
        p.subtitle { text-align: center; font-size: 14px; color: #94a3b8; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; }
        input:focus { border-color: #38bdf8; outline: none; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .links { margin-top: 20px; text-align: center; }
        .links a { color: #38bdf8; text-decoration: none; font-size: 14px; }
        .links a:hover { text-decoration: underline; }
        .flash-messages { background: #ef4444; color: white; padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 14px; }

        /* RESPONSIVIDADE (Tablets e Celulares pequenos) */
        @media (max-width: 480px) {
            .container { padding: 25px 20px; }
            h2 { font-size: 24px; }
            input, button { padding: 14px; font-size: 16px; } /* Botões maiores no celular facilitam o toque */
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Recuperar Senha</h2>
        <p class="subtitle">Insira seus dados cadastrados para receber uma nova senha temporária.</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash-messages">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/forgot-password" method="POST">
            <div class="form-group">
                <label>Nome de Usuário (Login)</label>
                <input type="text" name="username" placeholder="Ex: admin" required>
            </div>
            <div class="form-group">
                <label>E-mail Cadastrado</label>
                <input type="email" name="email" placeholder="seu-email@provedor.com" required>
            </div>
            <button type="submit">Enviar Nova Senha</button>
        </form>

        <div class="links">
            <a href="/">← Voltar para o Login</a>
        </div>
    </div>
</body>
</html>
