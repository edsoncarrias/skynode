<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SkyNode - Recuperar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: Segoe UI; padding-top: 10%; }
        .card-forgot { background: #111827; border: 1px solid #1e293b; border-radius: 15px; padding: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card-forgot shadow">
                    <h3 class="text-center mb-4">Recuperar Senha</h3>
                    
                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        {% for message in messages %}
                          <div class="alert alert-info text-center">{{ message }}</div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Digite seu usuário (Username):</label>
                            <input type="text" name="username" class="form-control" placeholder="Ex: admin" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" style="background-color: #0ea5e9;">Enviar Nova Senha</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="/login" style="color: #38bdf8; text-decoration: none;">← Voltar para o Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
