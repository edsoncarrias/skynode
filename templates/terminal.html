<!DOCTYPE html>
<html lang="pt-br">

<head>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1.0">

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SkyNode Terminal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Consolas;
}

.terminal-box{

    background:#111827;

    border-radius:20px;

    padding:20px;

    box-shadow:0 0 20px rgba(0,0,0,.3);
}

.terminal{

    background:black;

    color:#00ff66;

    padding:20px;

    border-radius:15px;

    height:500px;

    overflow-y:auto;

    white-space:pre-wrap;

    font-size:15px;

    border:1px solid #1e293b;
}

.command-line{

    display:flex;

    gap:10px;

    margin-top:20px;
}

.command-input{

    background:#0f172a !important;

    color:white !important;

    border:1px solid #1e293b !important;

    border-radius:12px !important;

    padding:12px !important;
}

.command-input:focus{

    box-shadow:none !important;

    border-color:#38bdf8 !important;
}

.btn-terminal{

    border-radius:12px;

    padding:12px 20px;

    font-weight:bold;
}

.title{

    color:#38bdf8;
}

</style>

</head>

<body>

<div class="container mt-4">

    <a href="/device/{{ hostname }}"
       class="btn btn-primary mb-4">

       ← Voltar

    </a>

    <div class="terminal-box">

        <h2 class="title mb-4">

            💻 SkyNode Remote Terminal

        </h2>

        <div
            id="terminal"
            class="terminal"
        >

SkyNode Remote Terminal iniciado...

Digite um comando abaixo.

        </div>

        <div class="command-line">

            <input
                type="text"
                id="commandInput"
                class="form-control command-input"
                placeholder="Digite um comando..."
                autocomplete="off"
            >

            <button
                class="btn btn-success btn-terminal"
                onclick="sendCommand()"
            >

                Executar

            </button>

        </div>

    </div>

</div>

<script>

async function sendCommand(){

    const input =
        document.getElementById(
            "commandInput"
        )

    const terminal =
        document.getElementById(
            "terminal"
        )

    const command =
        input.value.trim()

    if(!command){

        return

    }

    terminal.innerHTML +=
        "\n\nC:\\SkyNode> " +
        command +
        "\n"

    input.value = ""

    terminal.scrollTop =
        terminal.scrollHeight

    try{

        const response = await fetch(

            "/api/terminal/{{ hostname }}",

            {

                method: "POST",

                headers: {

                    "Content-Type":
                    "application/json"

                },

                body: JSON.stringify({

                    command: command

                })

            }

        )

        const data =
            await response.json()

        terminal.innerHTML +=
            "\n" +
            data.output +
            "\n"

    }

    catch(err){

        terminal.innerHTML +=

            "\nERRO:\n" +

            err +

            "\n"

    }

    terminal.scrollTop =
        terminal.scrollHeight

}

document
.getElementById("commandInput")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        sendCommand()

    }

})

</script>

</body>
</html>
