<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkyNode Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Segoe UI;
        }

        .login-box {
            width: 360px;
            padding: 35px;
            border-radius: 20px;
            background: #1e293b;
            box-shadow: 0 0 25px rgba(0,0,0,.4);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #38bdf8;
        }

        .form-control {
            background: #0f172a;
            border: none;
            color: white;
        }

        .form-control:focus {
            background: #0f172a;
            color: white;
            box-shadow: none;
            border: 1px solid #38bdf8;
        }

        .btn-login {
            background: #38bdf8;
            border: none;
            padding: 12px;
            font-weight: bold;
            color: white;
            border-radius: 8px;
            margin-top: 15px;
        }

        .btn-login:hover {
            background: #0ea5e9;
        }

        .forgot-link {
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .forgot-link:hover {
            color: #0ea5e9;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        SkyNode
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{% if category == 'success' %}success{% else %}info{% endif %} text-center small" style="border-radius: 10px;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Usuário"
                   required>
        </div>

        <div class="mb-2">
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Senha"
                   required>
        </div>
        
        <div class="text-end mb-3">
            <a href="/recuperar_senha" class="forgot-link">
                🔒 Esqueci minha senha
            </a>
        </div>
        
        <button type="submit" class="btn btn-login w-100">
            Entrar
        </button>

    </form>

</div>

</body>
</html>
