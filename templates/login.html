<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyNode Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
    font-family:Segoe UI;
}

.login-box{
    width:360px;
    padding:35px;
    border-radius:20px;
    background:#1e293b;
    box-shadow:0 0 25px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin-bottom:30px;
    color:#38bdf8;
}

.form-control{
    background:#0f172a;
    border:none;
    color:white;
}

.form-control:focus{
    background:#0f172a;
    color:white;
    box-shadow:none;
    border:1px solid #38bdf8;
}

.btn-login{
    background:#38bdf8;
    border:none;
    padding:12px;
    font-weight:bold;
    color:white;
}

.btn-login:hover{
    background:#0ea5e9;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        SkyNode
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-danger">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Usuário"
                   required>
        </div>

        <div class="mb-3">
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Senha"
                   required>
        </div>
        
        <button class="btn btn-login w-100">
            Entrar
        </button>
        
        <div style="margin-top: 15px; text-align: right;">
            <a href="/forgot-password" style="color: #38bdf8; text-decoration: none; font-size: 14px;">Esqueceu a senha?</a>
        </div>
    </form>

</div>

</body>
</html>
