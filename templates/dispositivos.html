<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyNode - Dispositivos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { margin: 0; background: #0f172a; color: white; font-family: Segoe UI; overflow-x: hidden; }
        .sidebar { width: 260px; height: 100vh; position: fixed; top: 0; left: 0; background: #111827; padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #1e293b; }
        .logo-container { text-align: center; margin-bottom: 25px; }
        .logo-img { width: 210px; filter: drop-shadow(0 0 15px #38bdf8); }
        .menu { flex: 1; margin-top: 20px; }
        .menu a { text-decoration: none; color: white !important; }
        .menu-item { padding: 14px; border-radius: 14px; margin-bottom: 12px; transition: .3s; font-weight: 500; }
        .menu-item:hover { background: #1e293b; transform: translateX(5px); color: #38bdf8 !important; }
        .logout-btn { text-decoration: none; text-align: center; background: linear-gradient(45deg, #ef4444, #dc2626); color: white !important; padding: 12px; border-radius: 20px; font-weight: bold; margin-top: auto; }
        .content { margin-left: 280px; padding: 30px; }
        .card-custom { background: #111827; border: none; border-radius: 22px; padding: 22px; box-shadow: 0 0 20px rgba(0,0,0,.25); }
        .table { color: white !important; }
        .table-dark { --bs-table-bg: #111827; }
        .badge { padding: 8px 12px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo-img">
        </div>
        
        <hr style="border-color: #1e293b;">
        <div class="menu">
            <a href="/dashboard"><div class="menu-item">🏠 Dashboard</div></a>
            <a href="/dispositivos"><div class="menu-item" style="background: #1e293b; color: #38bdf8 !important;">🖥️ Dispositivos</div></a>
            <a href="/mapa"><div class="menu-item">🗺️ Mapa da Rede</div></a>
            <a href="/monitoramento"><div class="menu-item">📊 Monitoramento</div></a>
            <a href="/configuracoes"><div class="menu-item">⚙️ Configurações</div></a>
        </div>
            <a href="/logout" class="logout-btn">🚪 Sair</a>
    </div>>

    <div class="content">
        <h1 class="mb-4">🖥️ Gerenciamento de Dispositivos</h1>
        
        <div class="card card-custom">
            <h5 class="mb-4 text-secondary">Inventário de Máquinas Monitoradas</h5>
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Hostname</th>
                            <th>Sistema Operacional</th>
                            <th>IP Local</th>
                            <th>IP Público</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable">
                        <tr>
                            <td colspan="5" class="text-center text-secondary">Buscando inventário do banco de dados...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Função para carregar as máquinas cadastradas
        async function loadInventory() {
            try {
                const response = await fetch("/api/devices");
                const devices = await response.json();
                const tbody = document.getElementById("inventoryTable");
                tbody.innerHTML = "";

                if(devices.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-secondary">Nenhum agente instalado ainda.</td></tr>`;
                    return;
                }

                devices.forEach(dev => {
                    tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold text-info">${dev.hostname}</td>
                        <td>${dev.system}</td>
                        <td><code>${dev.local_ip}</code></td>
                        <td><code>${dev.public_ip}</code></td>
                        <td>
                            <a href="/device/${dev.hostname}" class="btn btn-sm btn-outline-primary me-2">🔍 Ver Telemetria</a>
                            <button onclick="removerDispositivo('${dev.hostname}')" class="btn btn-sm btn-outline-danger">🗑️ Remover</button>
                        </td>
                    </tr>`;
                });
            } catch (err) {
                console.error("Erro ao carregar inventário:", err);
            }
        }

        function removerDispositivo(hostname) {
            if(confirm(`Deseja mesmo remover o host ${hostname} do SkyNode?`)) {
                // Aqui depois podemos colocar a rota de deletar se você quiser
                alert(`${hostname} removido visualmente! (Lógica de exclusão será ativada em breve)`);
            }
        }

        // Executa ao carregar a página
        loadInventory();
    </script>
</body>
</html>
