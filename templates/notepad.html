<!DOCTYPE html>
<html lang="pt-br">

<head>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1.0">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyNode Notepad</title>

<style>

body{
    margin:0;
    background:#0f172a;
    font-family:Segoe UI;
    color:white;
}

.topbar{
    background:#111827;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-size:20px;
    font-weight:bold;
}

.actions{
    display:flex;
    gap:10px;
}

button{

    background:#2563eb;
    border:none;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;

}

button:hover{
    background:#1d4ed8;
}

textarea{

    width:100%;
    height:calc(100vh - 70px);

    border:none;
    outline:none;

    resize:none;

    padding:20px;

    box-sizing:border-box;

    background:#0f172a;

    color:white;

    font-size:16px;

}

</style>

</head>

<body>

<div class="topbar">

<div class="title">
📝 SkyNode Notepad
</div>

<div class="actions">

<button onclick="saveNote()">
💾 Salvar
</button>

<button onclick="clearNote()">
🗑 Limpar
</button>

</div>

</div>

<textarea id="editor"></textarea>

<script>

const editor = document.getElementById("editor")

window.onload = () => {

    const saved = localStorage.getItem("skynode_note")

    if(saved){

        editor.value = saved

    }

}

function saveNote(){

    localStorage.setItem(
        "skynode_note",
        editor.value
    )

    alert("Nota salva!")

}

function clearNote(){

    if(confirm("Limpar tudo?")){

        editor.value = ""

        localStorage.removeItem(
            "skynode_note"
        )

    }

}

</script>

</body>

</html>
